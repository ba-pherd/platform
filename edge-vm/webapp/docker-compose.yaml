services:

# ----------------------------- END USER WEBAPP -----------------------------
  webapp:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: base
    ports:
      - 8080:80
    # will be present in the final vm after provisioned by Vagrant using the "env_variables" provisioning source
    env_file: '.env'
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3